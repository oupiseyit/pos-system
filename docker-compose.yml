# Local dev stack. Secrets come from .env (copy .env.example).
# App services run the source from ./apps with hot reload; no image builds.

x-node: &node
  image: node:22-alpine
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules # Linux binaries, kept off the macOS host
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:4
    ports: ['8080:8080']
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  api:
    <<: *node
    # ponytail: api does the one shared `npm install`; the front ends wait for it to be healthy
    command: sh -c "npm install && npm run dev -w apps/api"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      start_period: 120s
      retries: 5

  back-office:
    <<: *node
    command: npm run dev -w apps/backoffice -- --host 0.0.0.0 --port 5174
    environment:
      API_URL: http://api:3000 # Vite dev proxy target for /api
    ports: ['5174:5174']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5174']
      interval: 10s
      retries: 5

  web-front:
    <<: *node
    command: npm run dev -w apps/pos -- --host 0.0.0.0 --port 5173
    environment:
      API_URL: http://api:3000 # Vite dev proxy target for /api
    ports: ['5173:5173']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173']
      interval: 10s
      retries: 5

volumes:
  pgdata:
  node_modules:
