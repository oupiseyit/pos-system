name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate # typed client for apps/api; needs no database
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
# ponytail: skeleton. Phase 8 adds the Postgres service, npm audit and docker build.
