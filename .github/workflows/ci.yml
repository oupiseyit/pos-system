name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pos, POSTGRES_PASSWORD: pos, POSTGRES_DB: pos_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pos:pos@localhost:5432/pos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate # typed client for apps/api; needs no database
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
# ponytail: Phase 8 adds npm audit and docker build.
