<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A3 · Sell screen</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..700&family=Onest:wght@400..700&family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="pos">
  <header class="pos-top">
    <div class="logo"><span class="logo-mark">M</span>My Shop</div>
    <span class="till">T1</span>
    <span class="who"><span class="av" style="--c:#0e6b4e;width:26px;height:26px;font-size:10px">SO</span>Sokha</span>
    <div class="grow"></div>
    <span class="conn off"><i></i>Offline · 2 pending</span>
    <details style="position:relative">
      <summary class="btn" style="list-style:none">Menu <span class="ico s i-chev"></span></summary>
      <nav class="menu">
        <a href="a7-recent-sales.html"><span class="ico s i-receipt"></span>Recent sales</a>
        <a href="#"><span class="ico s i-refresh"></span>Sync now <span class="badge warn plain" style="margin-left:auto">Needs connection</span></a>
        <div class="sep"></div>
        <a href="a2-pin-login.html"><span class="ico s i-lock"></span>Lock</a>
        <a href="a2-pin-login.html"><span class="ico s i-user"></span>Log out</a>
      </nav>
    </details>
  </header>

  <div class="sell">
    <section class="catalog">
      <label class="scan">
        <span class="ico i-search"></span>
        <input autofocus placeholder="Scan barcode or search products" aria-label="Scan or search">
        <span class="scan-hint">F2</span>
      </label>
      <div class="cats">
        <button class="cat on">All <b>48</b></button><button class="cat">Drinks <b>14</b></button><button class="cat">Snacks <b>9</b></button>
        <button class="cat">Household <b>11</b></button><button class="cat">Coffee <b>4</b></button><button class="cat">Bakery <b>6</b></button>
      </div>
      <div class="tiles">
        <button class="tile"><div class="thumb" style="--c:#7a4a2b">CB<span class="stock lo">4</span></div><div class="nm">Coffee beans 250g</div><div class="pr">6.50</div></button>
        <button class="tile"><div class="thumb" style="--c:#5f8a3c">GT<span class="stock">38</span></div><div class="nm">Green tea</div><div class="pr">3.20</div></button>
        <button class="tile"><div class="thumb" style="--c:#3b86b8">W5<span class="stock">212</span></div><div class="nm">Water 500ml</div><div class="pr">0.50</div></button>
        <button class="tile"><div class="thumb" style="--c:#d39b1f">PC<span class="stock lo">0</span></div><div class="nm">Potato chips</div><div class="pr">1.20</div></button>
        <button class="tile"><div class="thumb" style="--c:#c2413a">CO<span class="stock">96</span></div><div class="nm">Cola 330ml</div><div class="pr">0.80</div></button>
        <button class="tile"><div class="thumb" style="--c:#c98d4b">CR<span class="stock lo">6</span></div><div class="nm">Croissant</div><div class="pr">1.50</div></button>
        <button class="tile"><div class="thumb" style="--c:#6b7f99">DS<span class="stock">15</span></div><div class="nm">Dish soap</div><div class="pr">2.40</div></button>
        <button class="tile"><div class="thumb" style="--c:#9a8f6d">R5<span class="stock">22</span></div><div class="nm">Rice 5kg</div><div class="pr">7.90</div></button>
        <button class="tile"><div class="thumb" style="--c:#8a5a2e">IC<span class="stock">40</span></div><div class="nm">Iced coffee</div><div class="pr">2.00</div></button>
        <button class="tile"><div class="thumb" style="--c:#6b3f86">GJ<span class="stock">27</span></div><div class="nm">Grape juice 1L</div><div class="pr">1.60</div></button>
      </div>
    </section>

    <aside class="cart" aria-label="Current sale">
      <div class="cart-h"><button class="cust-btn"><span class="ico i-user"></span>Add customer<span class="kbd">F4</span></button></div>
      <div class="lines">
        <div class="line" tabindex="0">
          <span class="cell-main">Coffee beans 250g</span><span class="amt">13.00</span>
          <span class="cell-sub num">6.50 each</span><span class="disc">−1.00</span>
          <span class="q"><button aria-label="Decrease">−</button><span>2</span><button aria-label="Increase">+</button></span>
        </div>
        <div class="line" tabindex="0">
          <span class="cell-main">Water 500ml</span><span class="amt">3.00</span>
          <span class="cell-sub num">0.50 each</span><span></span>
          <span class="q"><button aria-label="Decrease">−</button><span>6</span><button aria-label="Increase">+</button></span>
        </div>
      </div>
      <div class="sum">
        <div class="between"><span>Subtotal</span><span>16.00</span></div>
        <div class="between"><span>Discount</span><span>−1.00</span></div>
        <div class="between"><span>Tax</span><span>1.50</span></div>
        <div class="between total"><span>Total</span><span>$16.50</span></div>
      </div>
      <div class="cart-act">
        <button class="btn btn-xl">Clear</button>
        <a class="btn btn-primary btn-xl" href="a5-pay.html">Pay 16.50 <span class="kbd" style="border-color:#fff">F9</span></a>
      </div>
    </aside>
  </div>
  <a class="mock-tag" href="index.html">A3 · Sell</a>
</body>
</html>
